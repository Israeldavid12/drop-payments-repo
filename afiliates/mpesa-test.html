<body>
    <div class="container-sm d-grid">
        <h1>Teste de Pagamento C2B</h1>
        <form id="payment-form d-grid">
            <label for="transactionReference">Referência da Transação:</label>
            <input type="text" id="transactionReference" name="transactionReference" required>

            <label for="customerMSISDN">MSISDN (Número do Cliente):</label>
            <input type="text" id="customerMSISDN" name="customerMSISDN" required>

            <label for="amount">Valor da Transação (em MT):</label>
            <input type="number" id="amount" name="amount" required>

            <label for="thirdPartyReference">Referência do Sistema de Terceiros:</label>
            <input type="text" id="thirdPartyReference" name="thirdPartyReference" required>

            <button type="button" class="btn btn-outline-primary">Primary</button>
            <img src="https://megaofertasco.store/uploads/images/1738788170403-MANUEL-TOMAS.png" alt="Imagem do produto">

        </form>

        

        <div id="response" class="response"></div>
    </div>

    <script>
        document.getElementById("payment-form").addEventListener("submit", async function (event) {
            event.preventDefault();

            // Pegando os dados do formulário
            const transactionReference = document.getElementById("transactionReference").value;
            const customerMSISDN = document.getElementById("customerMSISDN").value;
            const amount = document.getElementById("amount").value;
            const thirdPartyReference = document.getElementById("thirdPartyReference").value;
          

            // Dados para enviar para o endpoint
            const requestData = {
                input_TransactionReference: transactionReference,
                input_CustomerMSISDN: customerMSISDN,
                input_Amount: amount,
                input_ThirdPartyReference: thirdPartyReference,
                input_ServiceProviderCode: '171717'
            };

            try {
                // Realizando a requisição POST ao backend (substitua pela URL do seu backend)
                const response = await fetch('http://127.0.0.1:5000/ap1/mpesa-payment-c2b', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': '*'  // O servidor precisa permitir esta origem no caso de CORS
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (response.ok) {
                    // Se o pagamento for bem-sucedido
                    document.getElementById('response').innerHTML = `
                        <p class="success">Pagamento realizado com sucesso!</p>
                        <p><strong>ID da Transação:</strong> ${data.output_TransactionID}</p>
                        <p><strong>Status:</strong> ${data.output_ResponseDesc}</p>
                    `;
                } else {
                    // Caso ocorra um erro
                    document.getElementById('response').innerHTML = `
                        <p class="error">Erro ao realizar o pagamento:</p>
                        <p>${data.error || 'Erro desconhecido'}</p>
                    `;
                }
            } catch (error) {
                console.error('Erro ao enviar a requisição:', error);
                document.getElementById('response').innerHTML = `
                    <p class="error">Erro ao enviar a requisição. Tente novamente.</p>
                `;
            }
        });
    </script>
</body>
