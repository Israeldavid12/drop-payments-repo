<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar produto</title>
    <link rel="shortcut icon" href="assests/dp-logo.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    
    <style>
      
     
        .footer {
            background-color: #ffffff;
            bottom: 0;
            left: 0;
            height: 70px;
            color: #424242;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 10px 30px;
            margin-top: 20px;
        }

        .recepiente {
            display: flex;
            justify-content: start;
            align-items: start;
            flex-direction: row;
            padding: 10px;
            gap: 10px;
            width: 100%;
            height: 100%;
            margin-top: 0px;
        }

        form {
            
            border-radius: 8px;
            padding: 30px;
            padding-top: 5px;
           

        }

        h2 {
            font-size: 14px;
            text-align: left;
            color: #333;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            display: block;
            margin-top: 15px;
        }

        input[type="text"],
        input[type="number"] {
            width: 400px;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #b0bec5;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            height: 45px;
            font-size: 15px;
        }
        textarea {
            height: 60px;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 18px
        }

        input[type="file"] {
            margin-top: 10px;
            padding: 3;
            width: 100%;
            height: 30px;
            border: 2px dashed #90caf9;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #f0f4f7;
            text-align: center;
            cursor: pointer;
            font-size: 18px;
        }

        input:focus {
            outline: none;
            border: 2px solid #326be6;
            
        }

        .textarea:focus {
            outline: none;
            border: 2px solid #326be6;
        }

        button[type="submit"] {
            background-color: #0288d1;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }

        button[type="submit"]:hover {
            background-color: #0277bd;
        }

        #message {
            color: #1da01d;
            font-size: 20px;
        }

        #messageUpsell {
            color: #1da01d;
            font-size: 20px;
        }

        #messageDownsell {
            color: #1da01d;
            font-size: 20px;
        }

        .info-inputs {
            color: #4b4b4b;
            font-weight: 400;
            font-size: 11px;
        }


        /* Ajuste para telas pequenas */
        @media (max-width: 768px) {
            form {
                max-width: 100%;
                margin: 20px 5%;
            }

            .content {
                margin-left: 0;
                /* Remove a margem esquerda em telas pequenas */
            }
            .footer {
                display: none;
            }
        }


        .select-image {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            vertical-align: middle;
        }

        #output {
        background-color: #e5f0fc;
        padding: 12px;
        border: 1px solid #1b68bb;
        border-radius: 8px;
    }

        @media (max-width: 1080px) {
            .form-container {
                margin-left: 0px;
            }

            .form {
                margin: 0px;
            }
        }
    </style>
</head>
