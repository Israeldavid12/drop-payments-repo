<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton Loading</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f4f4f4;
        }
        .skeleton-card {
            width: 200px;
            height: 250px;
            background: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .skeleton {
            background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 5px;
        }
        .skeleton.image {
            height: 120px;
        }
        .skeleton.text {
            height: 15px;
            width: 80%;
        }
        .skeleton.text.small {
            width: 60%;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="skeleton-card">
        <div class="skeleton image"></div>
        <div class="skeleton text"></div>
        <div class="skeleton text"></div>
        <div class="skeleton text small"></div>
    </div>
    <script>
        setTimeout(() => {
            document.querySelector(".skeleton-card").innerHTML = `
                <img src="https://via.placeholder.com/200x120" alt="Imagem de exemplo" style="width: 100%; border-radius: 5px;">
                <h3 style="margin-top: 10px;">Título do Item</h3>
                <p>Descrição curta do item carregado.</p>
            `;
        }, 3000); // Simula um carregamento de 3 segundos
    </script>
    
</body>
</html>
