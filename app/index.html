<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.7.2/css/all.css">

    <link rel="stylesheet" href="src/styles/dashboard.css">
    <link rel="stylesheet" href="src/styles/modals-styles/user-info-menu-modal.css">
    <link rel="stylesheet" href="src/styles/finance-hub.css">
    <link rel="shortcut icon" href="src/assets/logo-dp.png" type="image/x-icon">
    <link rel="stylesheet" href="src/styles/loading-icon.css">
    <link rel="stylesheet" href="src/styles/product-hub.css">
    <link rel="stylesheet" href="src/styles/withdraw-hub.css">
    <link rel="stylesheet" href="src/styles/profile-hub.css">
    <link rel="stylesheet" href="src/styles/create-product-hub.css">
    <script type="module" src="src/user/user_data.mjs"></script>
    <link rel="stylesheet" href="src/styles/animation/animations.css">

</head>

<body>
    <div class="overlay-popup">
        
    </div>

    <nav id="sidebar" class="show_sidebar">
        <div id="sidebar_content">
            <div id="company_info">
                <img src="src/assets/logo-dp.png" id="user_avatar" alt="Avatar">
                <span class="item-description logo_title">
                    DROP PAYMENT E.I
                </span>
                <i id="close_side_menu" class="bi bi-layout-sidebar-inset"></i>
                <i id="close_side_menu_mobile" class="bi bi-x-lg"></i>

            </div>

            <ul id="side_items">
                <li class="side-item">
                    <a href="#panel">
                        <i class="bi bi-house"></i>
                        <span class="item-description">
                            Dashboard
                        </span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="#products/my">
                        <i class="bi bi-box"></i>
                        <span class="item-description">
                            Meus produtos
                        </span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="#">
                        <i class="bi bi-graph-up-arrow"></i>
                        <span class="item-description">
                            Vendas
                        </span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="#withdraw">
                        <i class="bi bi-credit-card-2-back"></i>
                        <span class="item-description">
                            Carteira
                        </span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="#">
                        <i class="bi bi-gear"></i>
                        <span class="item-description">
                            Configurações
                        </span>
                    </a>
                </li>
                <li class="side-item">
                    <a href="#">
                        <i class="bi bi-gear"></i>
                        <span class="item-description">
                            Configurações
                        </span>
                    </a>
                </li>
                <li class="side-item">
                    <a href="#">
                        <i class="bi bi-gear"></i>
                        <span class="item-description">
                            Configurações
                        </span>
                    </a>
                </li>
            </ul>


        </div>

        <div id="logout">
            <button id="logout_btn">
                <i class="bi bi-box-arrow-right"></i>
                <span class="item-description">
                    Logout
                </span>
            </button>
        </div>
    </nav>






    <main id="main">

        <div id="blur" class=""></div>



        <!---HEADER--->
        <div class="header">
            <i id="open_menu" class="bi bi-list"></i>


            <div class="user">
                <i class="bi bi-bell"></i>
                <div>
                    <h2 id="open_user_menu"></h2>
                </div>
            </div>
        </div>


        <!---CONTAINER--->
        <div id="content" class="content">

            <div class="c-main-container">
                <p class="c-title">Criar produto: * </p>
                <div class="c-flex-container">

                    <div>
                        <p>Nome do produto: *</p>
                        <input type="text">
                    </div>
                    <div>
                        <p>Preço do Produto</p>
                        <input placeholder="0.00 MT" type="number">
                    </div>

                </div>
                <div class="c-textarena">
                    <p> Descrição do produto: *</p>
                    <textarea name="" id=""></textarea>
                    <p>0/200</p>
                </div>
                <div class="c-image-p">
                    <label for="productImage"><i class="fas fa-image"></i> Imagem do Produto:</label><br>
                    <input type="file" id="productImage" accept="image/*" required style="margin: 8px 0;">
                </div>
                <div class="c-baner-p">
                    <label for="productImage"><i class="fas fa-image"></i> Capa/Banner do Produto:</label><br>
                    <input type="file" id="productImage" accept="image/*" required style="margin: 8px 0;">
                </div>
                <div>
                    <label id="image-label" for="image-file">Upload image</label>
                    <input type="file" id="image-file" accept="image/x-png, image/jpeg" />

                </div>
                <!-- Campo de link externo estilizado -->
                <div id="productLinkDiv" style="display:none; margin-bottom: 20px;">
                    <label for="productLink" style="display: block;">Insira o link Externo do Produto:</label>
                    <input type="url" id="productLink" placeholder="https://example.com"
                        style="width: 100%; height: 20px;  padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>


                <!-- Campo de arquiv o PDF -->
                <div id="productDocDiv">
                    <label for="productDoc">Arquivo do Produto (.PDF):</label><br>
                    <input type="file" id="productDoc" accept=".pdf" required style="margin: 8px 0;">
                    <p id="output0" style="color: red; font-weight: bold; display: none;"></p>
                </div>
                <div>
                    <button id="create-product" class="c-create-p">Adicionar produto</button>
                </div>
            </div>



        </div>



    </main>

    <script src="src/scripts/functions-app.js"></script>
    <script type="module" src="src/scripts/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="src/pages/finances-hub.js"></script>
    <script type="module" src="src/scripts/sales-graphic.js"></script>


</body>

</html>
