<div class="config-checkout-container">

    <div class="config-checkout-payments-container">
        <p class="mb-2 font-semibold">Opções de Pagamento</p>
        <div class="config-checkout-payments-options">
            <div class="flex justify-between on-hover">
                <div class="flex">
                    <label class="switch">
                        <input id="emola" type="checkbox">
                        <span class="slider"> </span>
                    </label>
                    <img class="swicth-image" src="src/assets/emola.png" alt="">
                    <p class="ml-4 text-[14px] switch-name">e-Mola </p>
                </div>
                <div>
                    <i class="bi bi-caret-down-fill"></i>
                </div>

            </div>


        </div>
        <div class="config-checkout-payments-options">
            <div class="flex justify-between on-hover">
                <div class="flex">
                    <label class="switch">
                        <input id="mpesa" type="checkbox">
                        <span class="slider"> </span>
                    </label>
                    <img class="swicth-image" src="src/assets/mpesa.png" alt="">
                    <p class="ml-4 switch-name">M-pesa</p>

                </div>
                <div>
                    <i class="bi bi-caret-down-fill"></i>
                </div>

            </div>


        </div>
        <div class="config-checkout-payments-options">
            <div class="flex justify-between on-hover">
                <div class="flex">
                    <label class="switch">
                        <input id="paypal" type="checkbox">
                        <span class="slider"> </span>
                    </label>
                    <img class="swicth-image" src="src/assets/paypal.png" alt="">
                    <p class="ml-4 switch-name">PayPal</p>

                </div>
                <div>
                    <i class="bi bi-caret-down-fill"></i>
                </div>

            </div>


        </div>
        <div class="config-checkout-payments-options">
            <div class="flex justify-between on-hover">
                <div class="flex ">
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"> </span>
                    </label>
                    <img class="swicth-image" src="../v2/assets/pix.png" alt="pix">
                    <p class="ml-4 switch-name">Pix </p>
                </div>
                <div>
                    <i class="bi bi-caret-down-fill"></i>
                </div>

            </div>


        </div>

    </div>
    <div class="config-checkout-payments-container">
        <p class="mb-2 font-semibold">Opções de Peenchimento</p>
        <div class="config-checkout-payments-options">
            <div class="flex">
                <label class="switch">
                    <input id="manualPrice" type="checkbox">
                    <span class="slider"> </span>
                </label>
                <p class="ml-4 switch-name"><i class="bi bi-tag"></i> Preço inserido manualmente</p>
            </div>

        </div>
        <div class="config-checkout-payments-options">
            <div class="flex">
                <label class="switch">
                    <input id="nameBuyer" type="checkbox">
                    <span class="slider"> </span>
                </label>
                <p class="ml-4 switch-name"><i class="bi bi-person-circle"></i> Nome do comprador</p>
            </div>

        </div>
        <div class="config-checkout-payments-options">
            <div class="flex">
                <label class="switch">
                    <input id="emailBuyer" type="checkbox">
                    <span class="slider"> </span>
                </label>
                <p class="ml-4 switch-name"><i class="bi bi-envelope"></i> E-mail do comprador</p>
            </div>

        </div>
        <div class="config-checkout-payments-options">
            <div class="flex">
                <label class="switch">
                    <input id="whatsappBuyer" type="checkbox">
                    <span class="slider"> </span>
                </label>
                <p class="ml-4 switch-name"><i class="bi bi-telephone"></i> Contacto</p>
            </div>


        </div>


    </div>

<button id="save-config" class="save-config-checkout"><i class="bi bi-floppy"></i> Salvar alteracoes</button>
