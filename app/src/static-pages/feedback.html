<div id="feedback-section"
class="feedback-section max-w-2xl mx-auto p-6 bg-white border border-gray-200 rounded-lg shadow-md">
<h2 class="text-[20px] font-bold text-gray-800 mb-6">Envie seu Feedback ou Sugestão</h2>
<form id="feedback-form" class="feedback-form space-y-4">
    <div class="form-group">
        <label for="email" class="block text-sm font-medium text-gray-700">Email:</label>
        <input type="email" id="email" name="email" placeholder="Seu email" required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
    </div>
    <div class="form-group">
        <label for="nome" class="block text-sm font-medium text-gray-700">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
    </div>
    <div class="form-group">
        <label for="conteudo" class="block text-sm font-medium text-gray-700">Conteúdo:</label>
        <textarea id="conteudo" name="conteudo" placeholder="Escreva sua sugestão ou feedback aqui..."
            required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-y"
            rows="4"></textarea>
    </div>
    <button type="submit"
        class="submit-btn w-full px-4 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        Enviar
    </button>
</form>
</div>
