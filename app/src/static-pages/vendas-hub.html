<div class="sales-hub-container">
    <p class="page-title">Vendas <a href="#panel"><i class="bi bi-arrow-bar-left"></i> Dashboard</a></p>
    <p class="info">Confira o histórico de transações e administre suas vendas com facilidade.</p>

    <div class="sales-balance-container">
        <div class="sales-box">
            <p>Total de vendas realizadas <i class="bi bi-info-circle-fill"></i></p>
            <span id="sales-lenght" ></span>
        </div>
        <div class="sales-box">
            <p>Valor líquido <i class="bi bi-info-circle-fill"></i></p>
            <span id="sales-made" ></span>
        </div>
    </div>
    <label>Ultimas <span id="entries_value"></span> entradas</label>
    <div class="filter-sales">

        <div class="sales-filter-form">
            <label for="entries">Entradas:</label>
            <input type="number" id="sales-entries" placeholder="10" min="1" >

            <button class="filter-sales" id="filter-sales">Aplicar Filtros</button>
        </div>
    </div>

    <table class="table-sales-container" >
        <thead>
            <tr class="table-sales-title" >
                <th>Nome do produto:</th>
                <th>ID do Produto:</th>
                <th>Montante:</th>
                <th>M. de Pagamento:</th>
                <th>Nº do Pagamento:</th>
                <th>Email:</th>
                <th>Nome:</th>
                <th>WhatsApp: </th>
                <th>Data:</th>
            </tr>
        </thead>
        <tbody id="tbody-sales">

            
        </tbody>
    </table>
</div>
