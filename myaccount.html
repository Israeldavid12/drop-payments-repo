<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Meio de Pagamento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="shortcut icon" href="assests/dp-logo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      background-color: #f0f0f0;
    }
    .spinner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8); /* Fundo semi-transparente */
      z-index: 1050; /* Certifique-se que está acima de tudo */
    }
  </style>
</head>
<body>

<nav class="navbar p-3" style="background-color: #062858;">
  <form class="container-fluid justify-content-start">
    <button onclick="backPage()" style=" color: #fff;" class="btn btn-outline-primary me-2" type="button"><i class="fa fa-arrow-left" aria-hidden="true"></i> Voltar </button>
  </form>
</nav>



<div style="background-color: #ffffff;" class="container text-center p-5 mt-5 rounded shadow-sm">
  <div class="row">
    <div class="col">
      <div id="output" class="alert alert-primary mt-3" role="alert">
        Bem-vindo
      </div>
      <label for="name">Nome de conta</label>

      <div class="input-group flex-nowrap mt-2">
        <input id="name" type="text" class="form-control" placeholder="Nome de conta" aria-label="Username" aria-describedby="addon-wrapping">
      </div>
      
      <label for="titular">E-mail da conta</label>
      <div class="input-group flex-nowrap mt-2">  
        <input id="titular" type="text" class="form-control" placeholder="Nome de conta" aria-label="Username" aria-describedby="addon-wrapping">
      </div>

      <select class="form-select mt-3"  aria-label="Default select example">
        <option class="fw-bold" selected><strong>MZN </strong></option>
        <option value="1">MZN <i class="fa fa-money" aria-hidden="true"></i></option>
      </select>
     
 
      <button id="payment-form" style="width: 100%;" type="button" class="btn btn-outline-success mt-5"><i class="fa fa-save" aria-hidden="true"></i> Salvar </button>
    </div>
    
  <!--Perfil section-->
    <div class="col order-first">
      <label for="profileImage">Foto do Perfil <i class="fa fa-edit"></i> <!-- Ícone de editar --></label>
      <div style="min-width: 300px;" class="input-group mb-3">
        <input type="file" class="form-control"  id="profileImage" accept="image/*">
        <label class="input-group-text" for="inputGroupFile02">Upload</label>
      </div>
      <img  id="profileImagePreview" src="assests/dp-logo.png" alt="Pré-visualização da Imagem" style="width: 80px;border-radius: 50%; ">
      <div class="alert alert-primary mt-3" role="alert">
        <i class="fa fa-credit-card-alt" aria-hidden="true"></i> Suas informacoes de pagamento
      </div>
      <div class="input-group flex-nowrap mt-2">  
        <input id="paymentMethod" type="text" class="form-control" placeholder="" aria-label="Username" aria-describedby="addon-wrapping" disabled>
      </div>
      <div class="input-group flex-nowrap mt-2">  
        <input id="paymentNumber" type="text" class="form-control" placeholder="" aria-label="Username" aria-describedby="addon-wrapping"disabled>
      </div>
      <div class="input-group flex-nowrap mt-2">  
        <input id="nameAccount" type="text" class="form-control" placeholder="" aria-label="Username" aria-describedby="addon-wrapping" disabled>
      </div>
    </div>
    
  </div>
  <div id="loader" class="spinner-overlay d-flex justify-content-center align-items-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>
  </div>
</div>




<div style="color: #363636;" class=" text-center py-3 position-fixed bottom-0 w-100">
  <p>&copy; DROP PAYMENTS E.I.</p>
</div>









  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script>
    function backPage() {
      window.location.href = 'index.html';
    }
    document.getElementsByClassName('container')[0].style.opacity = '25%';
        function setLoading() {
            document.getElementsByClassName('container')[0].style.opacity = '100%';
            document.getElementById('loader').classList.add('d-none');

        }
        setTimeout(setLoading, 3000);

  </script>
  <script type="module">
    // Import the Firebase services
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js";
  
    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDfNNPtqhpG7ShUJo8n89ONoKOq45Xy91w",
      authDomain: "drop-payments-mz.firebaseapp.com",
      databaseURL: "https://drop-payments-mz-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "drop-payments-mz",
      storageBucket: "drop-payments-mz.appspot.com",
      messagingSenderId: "983262508468",
      appId: "1:983262508468:web:c0a6e26cf8789807b26ee1",
      measurementId: "G-JBP3RN50WS"
    };
  
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getDatabase(app);
    const storage = getStorage(app);
  
    // Elements
    const nameInput = document.getElementById('name');
    const titularInput = document.getElementById('titular');
    const paymentMethodP = document.getElementById('paymentMethod');
    const paymentNumberP = document.getElementById('paymentNumber');
    const nameAccountP = document.getElementById('nameAccount');
    const profileImageInput = document.getElementById('profileImage');
    const profileImagePreview = document.getElementById('profileImagePreview');
    const form = document.getElementById('payment-form');
  
    // Check if user is logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Get user ID and email
        const userId = user.uid;
        const userEmail = user.email;
  
        // Set email to titular input
        titularInput.value = userEmail;
  
        // Fetch user details from Realtime Database
        const userRef = ref(db, `users/${userId}`);
        get(userRef).then((snapshot) => {
          if (snapshot.exists()) {
            const userData = snapshot.val();
            nameInput.value = userData.name || '';
            if (userData.profileFoto) {
              profileImagePreview.src = userData.profileFoto;
            }
              // Fetch and insert payment method data dynamically
              if (userData.userpaymentMethods) {
              const paymentData = userData.userpaymentMethods;

              paymentMethodP.value = paymentData.metodo;
              paymentNumberP.value = paymentData.numero;
              nameAccountP.value = paymentData.titular;
            }
  
          }
        }).catch((error) => {
          console.error("Error fetching user data: ", error);
        });
      } else {
        // If not logged in, redirect to login page
        window.location.href = "entrar.html";
      }
    });
  
    // Handle image preview
    profileImageInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          profileImagePreview.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
  
    // Handle form submission and image upload
    form.addEventListener('click', () => {
      document.getElementById("output").innerText = "Salvando Informacoes...";
      const userId = auth.currentUser.uid;
      const userRef = ref(db, `users/${userId}`);
      const updatedName = nameInput.value;
      const updatedTitular = titularInput.value;
  
      // Update user data (name and email)
      update(userRef, {
        name: updatedName,
        email: updatedTitular
      }).then(() => {
        const saveStatus = document.getElementById("output");
        saveStatus.textContent = "Informações do usuário salvas com sucesso!";
        console.log("User data updated successfully");
      }).catch((error) => {
        const saveStatus = document.getElementById("output");
        saveStatus.textContent = "Erro ao salvar as informações! Entre em contato com o suporte.";
        console.error("Error updating user data: ", error);
      });
  
      // Upload profile picture to Firebase Storage
      const file = profileImageInput.files[0];
      if (file) {
        const storagePath = `profileImages/${userId}/${file.name}`;
        const storageReference = storageRef(storage, storagePath);
        uploadBytes(storageReference, file).then((snapshot) => {
          return getDownloadURL(snapshot.ref);
        }).then((downloadURL) => {
          // Store the download URL in the Realtime Database
          update(userRef, { profileFoto: downloadURL });
          profileImagePreview.src = downloadURL; // Update image preview
        }).catch((error) => {
          console.error("Error uploading profile picture: ", error);
        });
      }
    });
  </script>
</body>

</html>
