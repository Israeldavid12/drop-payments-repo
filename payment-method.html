<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Meio de Pagamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="shortcut icon" href="assests/dp-logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f0f0;
        }
          /* Cria um overlay de fundo */
    .spinner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8); /* Fundo semi-transparente */
      z-index: 1050; /* Certifique-se que está acima de tudo */
    }
    </style>
</head>

<body>
    <nav class="navbar p-3" style="background-color: #062858;">
        <form class="container-fluid justify-content-start">
            <button id="back-button" style=" color: #fff;" class="btn btn-outline-primary me-2" type="button"><i
                    class="fa fa-arrow-left" aria-hidden="true"></i> Voltar </button>
        </form>
    </nav>

    <div style="background-color: #ffffff;" class="container d-flex shadow-sm mt-4">
        <!-- Content here -->

      

        <div  style="max-width: 650px;background-color: #ffffff;" class="container-sm  mt-2 p-5">
            <div class="alert alert-primary" role="alert">
                <i class="fa fa-credit-card-alt" aria-hidden="true"></i> Cadastre o seu meio de pagamento que mais lhe
                convem.
            </div>
            <form class="payment-form" id="paymentForm">

                <select id="tipo-conta" class="form-select form-select-sm" aria-label="Small select example">
                    <option>Selecione um metodo de pagamento</option>
                    <option value="M-PESA">m-pesa</option>
                    <option value="E-MOLA">eMola</option>
                </select>
                <img id="imageELement" class="mt-2" style="width: 30px; border-radius: 5px; display: none;"
                    src="assests/emola.png" alt="">

                <div class="input-group input-group-sm mb-3 mt-3">
                    <span class="input-group-text" id="inputGroup-sizing-sm">Titular da conta</span>
                    <input id="titular" type="text" class="form-control" aria-label="Sizing example input"
                        aria-describedby="inputGroup-sizing-sm">
                </div>

                <div class="input-group input-group-sm mb-3 mt-3">
                    <span class="input-group-text" id="inputGroup-sizing-sm">Número da conta</span>
                    <input id="numero" type="text" class="form-control" aria-label="Sizing example input"
                        aria-describedby="inputGroup-sizing-sm">
                </div>
                <div class="d-grid gap-2">
                    <button id="saveInfo" class="btn btn-primary form-control" type="submit">Salvar</button>
                </div>


                <div id="statusRequest"
                    class="alert alert-success mt-3 d-flex justify-content-center  align-items-center" role="alert">
                </div>

        </div>


        <div style="max-width: 650px; background-color: #ffffff" class="container-sm mt-2 p-5 d-none d-md-block">
            <div class="alert alert-primary" role="alert">
                <i class="fa fa-credit-card-alt" aria-hidden="true"></i> Suas informacoes de pagamento salvas
            </div>
              <div class="input-group flex-nowrap mt-2">  
                <input id="paymentMethod" type="text" class="form-control" placeholder="N/A" aria-label="Username" aria-describedby="addon-wrapping" disabled>
              </div>
              <div class="input-group flex-nowrap mt-2">  
                <input id="paymentNumber" type="text" class="form-control" placeholder="N/A" aria-label="Username" aria-describedby="addon-wrapping"disabled>
              </div>
              <div class="input-group flex-nowrap mt-2">  
                <input id="nameAccount" type="text" class="form-control" placeholder="N/A" aria-label="Username" aria-describedby="addon-wrapping" disabled>
              </div>

        </div>

    </div>
    <div id="loader" class="spinner-overlay d-flex justify-content-center align-items-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
      </div>
    </div>

    <div style="color: #363636;" class=" text-center py-3 position-fixed bottom-0 w-100">
        <p>&copy; DROP PAYMENTS E.I.</p>
    </div>






























    <script>
        document.getElementsByClassName('container')[0].style.opacity = '25%';
        function setLoading() {
            document.getElementsByClassName('container')[0].style.opacity = '100%';
            document.getElementById('loader').classList.add('d-none');

        }
        setTimeout(setLoading, 3000);

        const selectElement = document.getElementById("tipo-conta");
        const imageElement = document.getElementById("imageELement");
        console.log(selectElement.value);
        selectElement.addEventListener('change', function () {
            // Obtém o valor da opção selecionada
            const selectedValue = selectElement.value;
            if (selectedValue === "M-PESA") {
                imageElement.src = "checkou-assets/mpesa-red.png";
                imageElement.style.display = 'block';

            }
            if (selectedValue === "E-MOLA") {
                imageElement.src = "assests/emola.png";
                imageElement.style.display = 'block';

            }
            if (selectedValue === "PAYPAL") {
                imageElement.src = "assests/paypal.png";
                document.getElementById("labelNumber").textContent = "Email da conta Paypal *";
                const input = document.getElementById("numero");
                input.placeholder = "Email da conta Paypal *";
                document.getElementById("paypalInfo").style.display = "block";
            }
            console.log('Valor selecionado: ' + selectedValue);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        // Import Firebase functions
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDfNNPtqhpG7ShUJo8n89ONoKOq45Xy91w",
            authDomain: "drop-payments-mz.firebaseapp.com",
            databaseURL: "https://drop-payments-mz-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "drop-payments-mz",
            storageBucket: "drop-payments-mz.appspot.com",
            messagingSenderId: "983262508468",
            appId: "1:983262508468:web:c0a6e26cf8789807b26ee1",
            measurementId: "G-JBP3RN50WS"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const auth = getAuth(app);

        // Reference to the form
        const paymentForm = document.getElementById('paymentForm');
        

        // Event listener for form submission
        paymentForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevent default form submission
            document.getElementById('statusRequest').textContent = "SALVANDO INFORMACOES...";

            // Get the input values
            const tipoConta = document.getElementById('tipo-conta').value;
            const numeroConta = document.getElementById('numero').value;
            const titularConta = document.getElementById('titular').value;

            // Check if a user is logged in
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    const userId = user.uid; // ID do usuário logado

                    // Save the payment method to Firebase Realtime Database
                    set(ref(database, 'users/' + userId + '/userpaymentMethods'), {
                        metodo: tipoConta,
                        numero: numeroConta,
                        titular: titularConta,
                    })
                        .then(() => {
                            document.getElementById("statusRequest").textContent = "Método de pagamento salvo com sucesso!";
                            window.location.href = "https://www.dropaymentsmz.online/";

                        })
                        .catch((error) => {
                            document.getElementById("statusRequest").textContent = "Erro ao salvar os dados: " + error.message;

                        });
                } else {
                    window.location.href = "https://www.dropaymentsmz.online/entrar";
                }
            });
        });
    </script>

    <!-- Script para o botão de voltar -->
    <script>
        const backButton = document.getElementById('back-button');
        backButton.addEventListener('click', () => {
            window.location.href = "https://www.dropaymentsmz.online/";
        });
    </script>
</body>

</html>
