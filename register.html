<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Drop Payments Moz</title>
    <link rel="shortcut icon" href="assests/dp-logo.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="criar-conta.css">
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDfNNPtqhpG7ShUJo8n89ONoKOq45Xy91w",
            authDomain: "drop-payments-mz.firebaseapp.com",
            databaseURL: "https://drop-payments-mz-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "drop-payments-mz",
            storageBucket: "drop-payments-mz.appspot.com",
            messagingSenderId: "983262508468",
            appId: "1:983262508468:web:c0a6e26cf8789807b26ee1",
            measurementId: "G-JBP3RN50WS"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const provider = new GoogleAuthProvider();

        const submeter = document.getElementById('submeter');

        




        // Função para criar uma conta
        function createAccount(email, password, name) {
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;

                    // Salva o nome do usuário no Realtime Database
                    set(ref(database, 'users/' + user.uid), {
                        name: name,
                        email: email
                    }).then(() => {
                        const userId_registered = user.uid;
                        const url_parms = new URLSearchParams(window.location.search);
                        const affId = url_parms.get('affId');
                        const affId_user = { affId, userId_registered };
                        fetch('https://www.mozbuyit.store/api/affiliates/', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(affId_user)
                        }).then(response => response.json()
                        ).then(data => {
                            if (data.estado === 'credited') {
                                console.log(data.message) 
                            }
                        }).catch((error) => {
                            console.log('erro: ', error);
                        });
                        submeter.textContent = "Conta criada e nome salvo com sucesso!";
                        window.location.href = "index.html";
                    }).catch((error) => {
                        submeter.textContent = "Criar minha conta";
                        console.error('Erro ao salvar o nome no Database:', error);
                    });
                })
                .catch((error) => {
                    submeter.textContent = "Criar minha conta";
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.error('Erro ao criar conta:', errorCode, errorMessage);
                    alert('Erro: ' + errorMessage);
                });
        }

        // Função de criação de conta com Google
        function signUpWithGoogle() {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;

                    // Salva o usuário no banco de dados caso ele seja novo
                    set(ref(database, 'users/' + user.uid), {
                        name: user.displayName,
                        email: user.email
                    }).then(() => {
                        submeter.textContent = "Conta criada com Google!";
                        window.location.href = "index.html";
                    }).catch((error) => {
                        console.error('Erro ao salvar dados do usuário Google:', error);
                    });
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.error('Erro na criação de conta com Google:', errorCode, errorMessage);
                    alert('Erro: ' + errorMessage);
                });
        }

        // Captura o envio do formulário
        window.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            form.addEventListener('submit', (event) => {
                //event.preventDefault();
                document.getElementById('output').textContent = 'Criacao de conta interdita!';

                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                /*if (document.getElementById('termos').checked) {
                    createAccount(email, password, name);
                    submeter.textContent = "Criando conta, aguarde...";
                } else {
                    alert('Você deve aceitar os termos e condições.');
                } */
            });

            // Adiciona o evento ao botão de login com Google
            const googleLoginBtn = document.getElementById('google-signup');
            
            googleLoginBtn.addEventListener('click',() => {
                document.getElementById('output').textContent = 'Criacao de conta interdita!';
            });
        });
    </script>
</head>

<body>
    <!-- Tela de carregamento -->
    <div id="loading-screen">
        <div>
            <img style="width: 40px; height: 40px;" src="assests/logo.png" alt="Logo DPM">
            <h2>CARREGANDO...</h2>
        </div>
    </div>

    <!-- Conteúdo principal da página -->
    <div id="content" class="hidden">
        <div class="content">
            <!-- Container da esquerda para texto em desktops -->
            <div class="left-container">
                <img style="width: 30px;" src="assests/dp-logo.png" alt="Logo Drop Payments Moz">
                <h2>Nunca foi tão fácil transformar o que você sabe em um negócio online.</h2>
                <p>Nós ajudaremos você a dar o próximo passo. Inscreva-se gratuitamente.</p>
            </div>

            <!-- Formulário de registro -->
            <div class="container">
                <h1 style="color:#353A40;;">REGISTRO</h1>
                <!-- Botão de login com Google -->
                <div id="google-signup" class="google-signup-container">
                    <img src="assests/google.png" alt="">
                    <button> Criar conta com Google</button>
                </div>
                <div style="margin: 15px;" class="line-with-text">
                    <span>Ou crie uma usando um e-mail</span>
                </div>
                <form>
                    <label for="nome">Nome</label>
                    <input type="text" id="name" placeholder="Seu nome completo" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="E-mail" required>

                    <label for="senha">Senha</label>
                    <input type="password" id="password" placeholder="Crie uma senha" required>
                    <p id="output" style="color: red; text-align: center; margin-bottom: 10px;" ></p>
 
                    <button id="submeter" type="submit">Criar minha conta</button>
                    <div class="checkbox-container">
                        <input type="checkbox" id="termos" name="termos" required>
                        <label for="termos">Aceito e concordo com os <a href="termos-e-condicoes.html">termos e
                                condições</a></label>
                    </div>
                </form>



                <div class="link">
                    Já tem uma conta? <a href="https://www.dropaymentsmz.online/entrar">Conecte-se</a>
                </div>
            </div>

            <button class="help-btn">
                <span class="icon">?</span> Ajuda
            </button>
        </div>
    </div>
</body>
<script>
    // JavaScript para esconder a tela de carregamento quando a página estiver completamente carregada
    window.addEventListener('load', function () {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('content').classList.remove('hidden');
    });

    document.querySelector('.help-btn').addEventListener('click', function () {
        // Substitua o link abaixo pelo link externo que deseja abrir
        window.open('https://api.whatsapp.com/send?phone=258863814050&text=Preciso%20de%20ajuda...', '_blank');
    });
</script>

</html>
