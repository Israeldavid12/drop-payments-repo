<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Pagamento PayPal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    label {
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
      display: block;
    }

    input[type="email"],
    input[type="number"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #0070ba;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #005c8c;
    }

    .error {
      color: red;
      font-size: 14px;
      margin-top: 10px;
    }

    .success {
      color: green;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
  <script>
    // Função para obter o token de acesso do PayPal
    async function getAccessToken() {
      const clientId = 'Ac-X_2mSdDUlHyk9_Ej-gCzGN3Jc_7QKJI97QIFRT7q99zV5L-Qau9UWl8Iu4tvR6b16Jr10CDCywoO9'; // Substitua pelo seu Client ID
      const clientSecret = 'ECdYdaQlEMGD5LIuUreFxN8al0IkRtrzX75GVEsvX6AQr9L9aieBK37s2w8Zv_PxueFfx99AL2JQIqqA'; // Substitua pelo seu Client Secret

      const credentials = btoa(`${clientId}:${clientSecret}`); // Codificar credenciais em Base64

      try {
        const response = await fetch('https://api-m.sandbox.paypal.com/v1/oauth2/token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'Authorization': `Basic ${credentials}`
          },
          body: 'grant_type=client_credentials'
        });

        if (response.ok) {
          const data = await response.json();
          return data.access_token;
        } else {
          console.error('Erro ao obter token de acesso:', await response.text());
          return null;
        }
      } catch (error) {
        console.error('Erro de requisição:', error);
        return null;
      }
    }

    // Função para fazer a requisição de pagamento para o PayPal
    async function sendPayment() {
      const receiverEmail = document.getElementById('receiverEmail').value;
      const amount = document.getElementById('amount').value;

      if (!receiverEmail || !amount) {
        document.getElementById('message').innerHTML = "Por favor, preencha todos os campos.";
        document.getElementById('message').classList.add('error');
        return;
      }

      const accessToken = await getAccessToken(); // Obter token válido
      if (!accessToken) {
        document.getElementById('message').innerHTML = "Erro ao autenticar com PayPal.";
        document.getElementById('message').classList.add('error');
        return;
      }

      const requestBody = {
        sender_batch_header: {
          sender_batch_id: `batch-${new Date().getTime()}`,
          email_subject: "Você tem um pagamento",
          email_message: "Você recebeu um pagamento. Obrigado por usar nosso serviço!"
        },
        items: [
          {
            recipient_type: "EMAIL",
            amount: {
              value: amount,
              currency: "USD"
            },
            note: "Obrigado pelo seu apoio!",
            sender_item_id: `item-${new Date().getTime()}`,
            receiver: receiverEmail
          }
        ]
      };

      fetch('https://api-m.sandbox.paypal.com/v1/payments/payouts', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${accessToken}` // Usar token obtido
        },
        body: JSON.stringify(requestBody)
      })
      .then(response => response.json())
      .then(data => {
        if (data.name) {
          document.getElementById('message').innerHTML = 'Erro: ' + data.message;
          document.getElementById('message').classList.add('error');
        } else {
          document.getElementById('message').innerHTML = 'Pagamento enviado com sucesso!';
          document.getElementById('message').classList.add('success');
        }
      })
      .catch(error => {
        console.error('Erro:', error);
        document.getElementById('message').innerHTML = 'Erro ao processar o pagamento.';
        document.getElementById('message').classList.add('error');
      });
    }
  </script>
</head>
<body>
  <div class="container">
    <h1>Teste de Pagamento PayPal</h1>

    <label for="receiverEmail">E-mail do destinatário:</label>
    <input type="email" id="receiverEmail" placeholder="Email do destinatário" required>

    <label for="amount">Valor (USD):</label>
    <input type="number" id="amount" placeholder="10.00" step="0.01" required>

    <button onclick="sendPayment()">Enviar Pagamento</button>

    <p id="message"></p>
  </div>
</body>
</html>
