<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Shopify</title>
    <script src="https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js"></script>
</head>
<body>
    <h1>Checkout Shopify</h1>
    <div>
        <h2>Adicionar Produto ao Carrinho</h2>
        <input type="text" id="productVariantId" placeholder="ID da Variante do Produto" />
        <input type="number" id="quantity" placeholder="Quantidade" min="1" />
        <button id="addToCartButton">Adicionar ao Carrinho</button>
    </div>

    <div>
        <h2>Criar Pedido</h2>
        <input type="email" id="customerEmail" placeholder="Email do Cliente" />
        <input type="text" id="shippingAddress" placeholder="Endereço de Entrega" />
        <button id="checkoutButton">Finalizar Pedido</button>
    </div>

    <div id="output"></div>

    <script>
        const client = ShopifyBuy.buildClient({
            domain: 'testetore.myshopify.com', // Substitua pelo domínio correto
            storefrontAccessToken: 'd1aaa9c8bc937685fc4297b7be9fa3c8', // Substitua pelo token correto
        });

        let cartId;

        // Função para criar o carrinho (se ainda não existir)
        const createCart = async () => {
            if (!cartId) {
                const cartCreateMutation = `
                    mutation {
                        cartCreate(input: {}) {
                            cart {
                                id
                                checkoutUrl
                            }
                        }
                    }
                `;

                const response = await client.graphQLClient.send({
                    query: cartCreateMutation,
                });

                cartId = response.data.cartCreate.cart.id; // Armazena o ID do carrinho
                return response.data.cartCreate.cart.checkoutUrl; // Retorna a URL de checkout
            }
        };

        // Função para adicionar produto ao carrinho
        document.getElementById('addToCartButton').onclick = async () => {
            const productVariantId = document.getElementById('productVariantId').value;
            const quantity = parseInt(document.getElementById('quantity').value);

            if (!productVariantId || !quantity) {
                document.getElementById('output').innerText = 'ID da variante do produto ou quantidade inválida!';
                return;
            }

            // Certifique-se de que o carrinho foi criado antes de adicionar produtos
            await createCart();

            const addToCartMutation = `
                mutation cartLinesAdd($cartId: ID!, $lines: [CartLineInput!]!) {
                    cartLinesAdd(cartId: $cartId, lines: $lines) {
                        cart {
                            id
                            lines {
                                id
                                quantity
                                merchandise {
                                    ... on ProductVariant {
                                        id
                                        title
                                    }
                                }
                            }
                        }
                        userErrors {
                            field
                            message
                        }
                    }
                }
            `;

            const response = await client.graphQLClient.send({
                query: addToCartMutation,
                variables: {
                    cartId: cartId, // Usa o carrinho criado
                    lines: [{ quantity: quantity, merchandiseId: productVariantId }],
                },
            });

            if (response.data.cartLinesAdd.userErrors.length > 0) {
                document.getElementById('output').innerText = 'Erro ao adicionar ao carrinho: ' + response.data.cartLinesAdd.userErrors[0].message;
            } else {
                document.getElementById('output').innerText = 'Produto adicionado ao carrinho!';
            }
        };

        // Função para criar o pedido
        document.getElementById('checkoutButton').onclick = async () => {
            const email = document.getElementById('customerEmail').value;
            const shippingAddress = document.getElementById('shippingAddress').value;

            if (!email || !shippingAddress) {
                document.getElementById('output').innerText = 'Preencha o email e o endereço de entrega!';
                return;
            }

            // Certifique-se de que o carrinho foi criado
            const checkoutUrl = await createCart();

            const cartUpdateMutation = `
                mutation cartBuyerIdentityUpdate($cartId: ID!, $buyerIdentity: CartBuyerIdentityInput!) {
                    cartBuyerIdentityUpdate(cartId: $cartId, buyerIdentity: $buyerIdentity) {
                        cart {
                            id
                            buyerIdentity {
                                email
                            }
                        }
                        userErrors {
                            field
                            message
                        }
                    }
                }
            `;

            const response = await client.graphQLClient.send({
                query: cartUpdateMutation,
                variables: {
                    cartId: cartId, // Usa o carrinho criado
                    buyerIdentity: {
                        email: email,
                        phone: "",
                        countryCode: "BR", // Brasil
                    },
                },
            });

            if (response.data.cartBuyerIdentityUpdate.userErrors.length > 0) {
                document.getElementById('output').innerText = 'Erro ao atualizar o comprador: ' + response.data.cartBuyerIdentityUpdate.userErrors[0].message;
            } else {
                document.getElementById('output').innerHTML = `Pedido criado com sucesso! <a href="${checkoutUrl}" target="_blank">Finalizar Checkout</a>`;
            }
        };
    </script>
</body>
</html>
