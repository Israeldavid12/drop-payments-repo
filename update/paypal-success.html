<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processar Pagamento</title>
</head>
<body>

  <script>
    // Função para capturar parâmetros da URL
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        PayerID: params.get('PayerID'),
        paymentId: params.get('paymentId'),
        clientId: params.get('clientId'),
        sucessPage: params.get('sucessPage'),
        bidUSD: params.get('bidUSD'),
        productId: params.get('productId'),
        nameProduct: params.get('nameProduct'),
        emailPayer: params.get('emailPayer'),
      };
    }

    // Função para enviar os dados para o backend
    async function sendPaymentData() {
      const params = getUrlParams();

      // Verificar se todos os parâmetros estão presentes
      if (
        !params.PayerID || 
        !params.paymentId || 
        !params.clientId || 
        !params.sucessPage || 
        !params.bidUSD || 
        !params.productId || 
        !params.nameProduct
      ) {
        alert('Dados insuficientes!');
        return;
      }

      // Enviar dados para a API
      try {
        const response = await fetch('https://www.dropaymentsmz.online/api/paypal-success', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(params), // Envia os parâmetros no corpo da requisição
        });

        const data = await response.json();
        if (response.ok) {
          console.log('Pagamento processado com sucesso!', data);
          // Redirecionar para a página de sucesso, passando o link com os parâmetros
          window.location.href = data.redirectUrl;
        } else {
          console.error('Erro ao processar pagamento:', data.message);
        }
      } catch (error) {
        console.error('Erro de comunicação com a API:', error);
      }
    }

    // Chamar a função de envio ao carregar a página
    window.onload = sendPaymentData;
  </script>
</body>
</html>
