<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP - Página de Pagamento Segura</title>
    <link rel="shortcut icon" href="../assets/dp-logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script
        src="https://www.paypal.com/sdk/js?client-id=ASqxMwsdnMl-ebsp3qZ6BXLFsGJmv1Ui2pfPKBD9RWXWeDsjUa19J2Ck6C4n3a_zOw8XKGt1WGwubn_h&buyer-country=US&currency=USD&components=buttons,card-fields&enable-funding=venmo&disable-funding=paylater"
        data-sdk-integration-source="developer-studio"></script>
    <link rel="stylesheet" href="../styles/checkout-typed.css">
    <link rel="stylesheet" href="../styles/sales-made.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/loading-icon.css">
    <link rel="stylesheet" href="../styles/timer.css">
    <link rel="stylesheet" href="../styles/select-tag.css">
    <link rel="stylesheet" href="../../app/src/styles/animation/animations.css">
    <link rel="stylesheet" href="../styles/modals/produc-not-found.css">
    <link rel="stylesheet" href="../styles/modals/index.css">
    <script type="module" src="../scripts/loader.js"></script>

</head>

<body>

    <div id="pixel"> </div>

    <!-- Área da notificação -->
    <div id="purchase-notification" class="notification hidden"></div>

    <!-- Cronômetro movido para fora do contêiner -->
    <div class="container-timer">
        <div id="timer" class="timer">00 : 00 : 00</div>
        <div>
            <img class="info-icon" src="https://img.icons8.com/ios/50/ffffff/timer.png" alt="Ícone do cronômetro">
        </div>
        <div class="info">
            <div class="info-text">Preencha os seus dados antes que o cronômetro termine</div>
        </div>
    </div>

    <div class="body2">
        <img id="baner-url" style="border-radius: 6px; max-width: 620px; display: none;" class="secure-icon"
            src="../../checkou-assets/default-banner.jpg" alt="Banner container">
        <div class="container">
            <div class="info-secure-coneteiner">

                <hr style="margin-bottom: 18px;">

            </div>
            <select name="cars" id="cars">
                <option value="volvo">MZ</option>
                <option value="saab">BR</option>
                <option value="mercedes">USA</option>
                <option value="audi">RSA</option>
            </select>

            <div>

                <div class="product-info">
                    <img id="image-url" src="../../checkou-assets/default-img.jpg" alt="logo">
                    <div class="product-details">
                        <p>Esta a pagar:</p>
                        <h2 id="productName" style="color: #000000; font-weight: 600;"></h2>
                        <p style="font-size: 14px;">COMPRA 100% SEGURA</p>
                        <p id="productPrice" class="product-price">
                        <p class="product-price">
                    </div>
                </div>

                <hr style="margin-bottom: 16px;">
                <form>

                    <div class="form-group">

                        <label id="labelNome" for="text">Digite seu nome completo </label>
                        <div class="input-container" id="divnome">
                            <i class="bi bi-person"></i>
                            <input id="nome" type="text" placeholder="Digite seu nome completo" required>
                        </div>
                        <p id="inputoutputNome"
                            style="color: red; display: none; font-size: 14px; margin-bottom: 30px; font-weight: bold; text-align: center;">
                        </p>
                    </div>

                    <div class="form-group">
                        <label id="labelEmail" for="email">Digite seu melhor e-mail</label>

                        <div class="input-container" id="divemail">
                            <i class="bi bi-envelope"></i>
                            <input id="email" type="email" placeholder="Digite seu melhor e-mail" required>
                        </div>
                        <p id="inputoutputEmail"
                            style="color: red; display: none; font-size: 14px; margin-bottom: 30px; font-weight: bold; text-align: center;">
                            O número de pagamento deve ter exatamente 9 dígitos.</p>
                    </div>
                    <div class="form-group">
                        <label id="labelWhatsapp" for="tel">Digite seu whatsapp</label>

                        <div class="input-container" id="divwhatsapp">
                            <i class="bi bi-whatsapp"></i>
                            <input id="whatsapp" type="tel" placeholder="Seu whatsapp">
                        </div>
                    </div>
                    <hr>
                    <div class="payment-options">

                        <div style="margin-bottom: 40px;" class="form-group">
                            <label style="font-size: 14px; text-align: start; display: none; " id="labeInserted"
                                for="tel">Insira o montante a pagar</label>


                            <div class="input-container" id="divpriceInserted" style="display: none;">
                                <img src="../../assests/vendas-black.png" alt="whatsapp">
                                <input id="priceInserted" type="number" placeholder="0.00 MT">
                            </div>


                            <p id="inputoutputPrice"
                                style="color: red; display: none; font-size: 14px; margin-bottom: 30px; font-weight: bold; text-align: center;">
                                .</p>
                        </div>
                        <p style="font-weight: bold; margin-bottom: 15px; color: #062858; font-size: 14px;">Escolha seumetodo de pagamento</p>

                        <img class="mpesa" src="../assets/mpesa.png" alt="M-Pesa" id="mpesa" onclick="selectMpesa()">
                        <img src="../assets/emola.png" alt="e-Mola" id="emola" onclick="selectEmola()">
                       
                        <img src="../assets/paypal.png" alt="paypal" id="paypal" onclick="selectPayPal()">
                    </div>

                    <div class="form-group">


                        <div class="input-container" id="divpriceInserted">
                            <img src="../../assests/fone-number.png" alt="">
                            <input id="paynumber" type="text" placeholder="Digite seu número M-Pesa" required>
                        </div>
                        <p id="inputoutput"
                            style="color: red; display: none; font-size: 14px; margin-bottom: 30px; font-weight: bold; text-align: center;">
                            O número de pagamento deve ter exatamente 9 dígitos.</p>
                    </div>
            </div>

            <button class="pay-btn paypal" id="pay-btn">Pagar com M-Pesa</button>
            <div id="paypal-button-container" class="paypal-button-container"></div>
            </form>

        </div>
        <div>
            <p style="text-align: center; margin-top: 5px;font-size: 12px;">© 2024 Drop Payments Mz</p>
        </div>

    </div>




    <script src="../scripts/app.js"></script>
    <script type="module" src="../scripts/product-data/index.js"></script>
    <script type="module" src="../scripts/payments/paypal.js"></script>
</body>

</html>
