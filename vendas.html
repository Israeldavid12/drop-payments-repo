<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas</title>
    <link rel="shortcut icon" href="assests/dp-logo.png" type="image/x-icon">
    <link rel="stylesheet" href="vendas.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <style>
        /* Seus estilos personalizados aqui */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        .gray-row {
            background-color: #f0f0f0;
        }
        .amount {
            display: none;
            border: 1px solid black;
          padding: 15px;
          padding-left: 40px;
          padding-bottom: 10px;
          background-color: white;
        }
        .amount p {
            font-size: 18px;
            color: rgb(70, 75, 82);
        }
    </style>
</head>
<body>
    <div class="header">
        <img id="back-button" src="assests/back-blue.png" alt="DP logo" class="logo">
        <div class="title-section">
            <h1>Vendas</h1>
            <p>Veja detalhes das transações e administre todas as suas vendas detalhadamente ( REST API)</p>
        </div>
        <button id="reload-button" class="reload-btn">
            <img src="assests/reload.png" alt="Reload">
        </button>
       
    </div>
    <div class="container my-4">
        <div class="row justify-content-center">

            <div class="col-md-8">
              

                <!-- Estatísticas -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <div class="stat-box">
                            <div class="stat-title">Total de vendas realizadas</div>
                            <div id="salesMade" class="stat-value">0</div>
                           
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="stat-box">
                            <div class="stat-title">Valor líquido</div>
                            <div style="color: rgb(4, 112, 4);" id="amountMade" class="stat-value">MZN 0,00</div>
                           
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap e ícones -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.9.1/font/bootstrap-icons.min.js"></script>
                   <div class="amount">
                    <p>Receita Líquida</p>
                    <p >MZN 0.00 </p>
               
                   </div>
    <table>
        <thead>
            <tr>
                <th>Nome do produto:</th>
                <th>ID do Produto:</th>
                <th>Montante:</th>
                <th>M. de Pagamento:</th>
                <th>Nº do Pagamento:</th>
                <th>Email:</th>
                <th>Nome:</th>
                <th>WhatsApp:</th>
                <th>Data:</th>
            </tr>
        </thead>
        <tbody id="payments-table-body">
            <!-- Os dados serão carregados aqui -->
        </tbody>
    </table>
  

<script type="module">
// Importando o Firebase
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { getDatabase, ref, onValue, orderByChild, query } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

// Configuração do Firebase
const firebaseConfig = {
    apiKey: "AIzaSyDfNNPtqhpG7ShUJo8n89ONoKOq45Xy91w",
    authDomain: "drop-payments-mz.firebaseapp.com",
    databaseURL: "https://drop-payments-mz-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "drop-payments-mz",
    storageBucket: "drop-payments-mz.appspot.com",
    messagingSenderId: "983262508468",
    appId: "1:983262508468:web:c0a6e26cf8789807b26ee1",
    measurementId: "G-JBP3RN50WS"
};

// Inicializando Firebase
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const auth = getAuth(app);

// Verifica se o usuário está autenticado
onAuthStateChanged(auth, (user) => {
    if (user) {
        const userId = user.uid; // Pega o ID do usuário logado
        console.log("Usuário logado:", userId);

        // Busca os dados dos pagamentos para o usuário logado
        const paymentsRef = ref(database, `users/${userId}/paymentsBackup/`);
        onValue(paymentsRef, (snapshot) => {
            const paymentsData = snapshot.val();
            const paymentsTableBody = document.getElementById('payments-table-body');
            paymentsTableBody.innerHTML = ''; // Limpa a tabela antes de inserir os novos dados

            let totalSales = 0;
            let totalAmount = 0;

            if (!paymentsData) {
                console.log('Nenhum pagamento encontrado para este usuário.');
                return;
            }

            // Percorre os pagamentos e os insere na tabela
            Object.keys(paymentsData).forEach((paymentId, index) => {
                const payment = paymentsData[paymentId];
                const amountSuffix = payment.paymentMethod === "PayPal" ? "USD" : "MT"; // Lógica para o sufixo da moeda

                // Se for PayPal, converte o valor, caso contrário, usa o valor original
                let paymentAmount = parseFloat(payment.originalAmount);
                if (payment.paymentMethod === "PayPal") {
                    paymentAmount = paymentAmount; // Converte para MZN
                }

                totalSales++; // Contagem de vendas
                totalAmount += paymentAmount; // Soma o valor convertido

                // Gerar ID dinâmico para a imagem
                const paymentImageId = `paymentImage-${index}`;

                // Criação da linha da tabela
                const row = `
                    <tr>
                        <td>${payment.nome || "N/A"}</td>
                        <td>${payment.productId || "N/A"}</td>
                        <td>${paymentAmount.toFixed(2)} MT</td>
                        <td><img id="${paymentImageId || "N/A"}" style="width: 30px;  border-radius: 4px;" src="" alt=""> ${payment.paymentMethod || "N/A"}</td>
                        <td>${payment.paymentNumber || "N/A" }</td>
                        <td>${payment.paymentEmail || "N/A"}</td>
                        <td>${payment.paymentName || "N/A"}</td>
                        <td>${payment.paymentWhatsapp || "N/A"}</td>
                        <td>${payment.timestamp || "N/A"}</td>
                    </tr>
                `;

                // Inserir a linha na tabela
                paymentsTableBody.innerHTML = row + paymentsTableBody.innerHTML;


                // Após a linha ser inserida, atualizar a imagem de acordo com o método de pagamento
                const paymentImage = document.getElementById(paymentImageId);
                switch (payment.paymentMethod) {
                    case 'PayPal':
                        paymentImage.src = "assests/paypal.png";
                        break;
                    case 'E-Mola':
                        paymentImage.src = "assests/emola.png";
                        break;
                    case 'M-pesa':
                        paymentImage.src = "checkou-assets/mpesa-red.png";
                        break;
                    default:
                        paymentImage.src = ""; // Se não houver um método de pagamento correspondente
                        break;
                }
            });

            // Formatar o valor total como moeda no formato BRL
            const formattedAmount = totalAmount.toLocaleString('pt-BR', { style: 'currency', currency: 'MZN' });

            // Atualiza os elementos de estatísticas
            document.getElementById('salesMade').textContent = totalSales; // Total de transações
            document.getElementById('amountMade').textContent = formattedAmount; // Valor total convertido
        }, {
            onlyOnce: true // Carrega os dados apenas uma vez
        });
    } else {
        console.log("Usuário não está logado");
        // Redirecionar para a página de login
        window.location.href = 'https://www.dropaymentsmz.online/entrar';
    }
});



</script>


    <script src="vendas.js"></script>
</body>
</html>
